<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- SEO -->
    <title>Neuron — AI Learning Portal for High School Students</title>
    <meta
      name="description"
      content="Neuron is a free, interactive AI literacy course for high school students covering AI fundamentals, practical tools, and ethical use — with XP, badges, and mini-games."
    />
    <link rel="canonical" href="https://neurontsa.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://neurontsa.vercel.app/" />
    <meta property="og:title" content="Neuron — AI Learning Portal for High School Students" />
    <meta
      property="og:description"
      content="A free, interactive AI literacy course covering AI fundamentals, practical tools, and ethical use. Earn XP, unlock badges, and challenge yourself with mini-games."
    />
    <meta property="og:image" content="https://neurontsa.vercel.app/og-preview.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://neurontsa.vercel.app/" />
    <meta name="twitter:title" content="Neuron — AI Learning Portal for High School Students" />
    <meta
      name="twitter:description"
      content="A free, interactive AI literacy course covering AI fundamentals, practical tools, and ethical use. Earn XP, unlock badges, and challenge yourself with mini-games."
    />
    <meta name="twitter:image" content="https://neurontsa.vercel.app/og-preview.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Self-hosted fonts (OFL-1.1 — see /copyright for license details).
         Preload the two weights used above the fold so the first paint never
         falls back to the system sans-serif. Latin subset only: covers all
         site copy without the overhead of the full unicode range. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-tight-300.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-tight-400.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
