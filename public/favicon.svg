<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Neuron mark: a small node network, echoing the site's 3D brain
       visualization and the BrainCircuit icon used in the nav — simple
       enough to still read clearly at 16px favicon size. -->
  <circle cx="24" cy="24" r="22" fill="#020617"/>
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="24" y1="12" x2="14" y2="20"/>
    <line x1="24" y1="12" x2="34" y2="20"/>
    <line x1="14" y1="20" x2="18" y2="32"/>
    <line x1="34" y1="20" x2="30" y2="32"/>
    <line x1="18" y1="32" x2="30" y2="32"/>
    <line x1="14" y1="20" x2="34" y2="20"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="24" cy="12" r="3.4"/>
    <circle cx="14" cy="20" r="3"/>
    <circle cx="34" cy="20" r="3"/>
    <circle cx="18" cy="32" r="3"/>
    <circle cx="30" cy="32" r="3"/>
  </g>
</svg>
